<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>City-Site - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-header">
        <h1>Account Sign In</h1>
        <nav>
            <a href="/" class="nav-link">Home</a>
            <a href="login.html" class="nav-link">Login</a>
            <a href="/admin" class="nav-link">Admin Dashboard</a>
            <a href="weather.html" class="nav-link">Weather</a>
            <a href="api.html" class="nav-link">API Dashboard</a>
        </nav>
    </header>

    <main>
        <h2>User Authorization</h2>
        <form action="/auth" method="POST" id="auth-form" class="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            
            <label for="city">Default City:</label>
            <select id="city" name="city">
                <option value="kharkiv">Kharkiv</option>
                <option value="dnipro">Dnipro</option>
                <option value="kyiv">Kyiv</option>
            </select>
            <br><br>

            <label for="notes">Support Request / Notes:</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
            <br><br>

            <div id="message-container" style="margin-bottom: 15px; font-weight: bold;"></div>

            <button type="submit" id="login-btn">Sign In</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
